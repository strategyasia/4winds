<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Suspended - Four Winds Worldwide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
        }
        .card {
            text-align: center;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 90%;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 1.25rem;
            display: block;
        }
        .logo {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e07820;
            margin-bottom: 1.75rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.75rem;
        }
        .badge {
            display: inline-block;
            background: #7f1d1d;
            color: #fca5a5;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 1.5rem;
        }
        p {
            color: #999;
            font-size: 0.92rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }
        .powered {
            margin-top: 2rem;
            font-size: 0.72rem;
            color: #444;
        }
        .powered a {
            color: #e07820;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">⚠️</span>
        <div class="logo">Four Winds Worldwide</div>
        <span class="badge">Account Suspended</span>
        <h1>This website has been suspended</h1>
        <p>This website is currently unavailable due to a renewal requirement. Please contact your service provider to restore your service.</p>
        <div class="powered">Powered by <a href="https://dorvin.in" target="_blank" rel="noopener">Dorvin</a></div>
    </div>
</body>
</html>
